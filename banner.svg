<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Khyati, CS undergrad and full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171410"/>
      <stop offset="1" stop-color="#0F1413"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A541"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F2A541" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#F2A541" stroke-opacity="0.25"/>

  <!-- margin line, like a notebook page -->
  <line x1="70" y1="0" x2="70" y2="260" stroke="#2EC4B6" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- top-left window dots -->
  <circle cx="34" cy="34" r="5" fill="#F2A541"/>
  <circle cx="34" cy="56" r="5" fill="#2EC4B6"/>
  <circle cx="34" cy="78" r="5" fill="#E8E2D5" fill-opacity="0.6"/>

  <!-- label -->
  <text x="110" y="78" font-family="'Courier New', Courier, monospace" font-size="17" fill="#2EC4B6" letter-spacing="3">// HELLO, WORLD. I AM</text>

  <!-- name -->
  <text x="108" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#F4EEE0">Khyati</text>
  <rect x="110" y="178" width="210" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="110" y="220" font-family="'Courier New', Courier, monospace" font-size="19" fill="#B9B2A3">full-stack dev  ·  problem solver  ·  always shipping</text>

  <!-- decorative code glyph -->
  <text x="800" y="170" font-family="'Courier New', Courier, monospace" font-size="120" font-weight="700" fill="url(#accent)" fill-opacity="0.9">&lt;/&gt;</text>
  <text x="808" y="206" font-family="'Courier New', Courier, monospace" font-size="14" fill="#B9B2A3" letter-spacing="2">NIT JAMSHEDPUR</text>
</svg>
